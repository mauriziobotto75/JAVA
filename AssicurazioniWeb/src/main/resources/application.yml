spring:
  application:
    name: assicurazioni-web
  datasource:
    url: jdbc:h2:file:./data/assicurazioni;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  error:
    include-message: never
